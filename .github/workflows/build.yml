name: Build & Release C++20

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build solution
        run: >
          msbuild "Puissance 4.slnx"
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Package build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -match '\\x64\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Contenu du projet :"
            Get-ChildItem -Path . -Recurse -Filter "*.exe"
            throw "Aucun executable Release x64 trouve."
          }

          Write-Host "Executable trouve : $($exe.FullName)"
          Write-Host "Dossier : $($exe.Directory.FullName)"

          Compress-Archive `
            -Path "$($exe.Directory.FullName)\*" `
            -DestinationPath "Puissance-4-Windows-x64.zip" `
            -Force

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" `
            "Puissance-4-Windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Puissance 4 - Build ${{ github.run_number }}" `
            --generate-notes